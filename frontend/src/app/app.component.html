<main>
  <h1>{{ title() }}</h1>
  <app-document-input [loading]="loading()" (extract)="onExtract($event)" />

  @if (errorMessage(); as message) {
    <p class="error" role="alert">{{ message }}</p>
  }

  @if (result(); as data) {
    <h2>Review the extracted details</h2>
    <app-extraction-form [result]="data" (submitted)="onSubmitted($event)" />
  }

  @if (submittedValues(); as values) {
    <section class="submitted">
      <h2>Submitted (not saved)</h2>
      <pre>{{ values | json }}</pre>
    </section>
  }
</main>
